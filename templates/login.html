<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>Sign In - CityCare Hospital</title><script>!function(){const t=localStorage.getItem('citycare-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}()</script><link rel="stylesheet" href="{{ url_for('static',filename='css/app.css') }}"><script src="{{ url_for('static',filename='js/app.js') }}" defer></script></head><body class="login-page"><header class="public-nav"><a class="brand" href="{{ url_for('landing') }}"><span class="brand-cross">+</span><span>CityCare<small>Hospital</small></span></a><button class="icon-button" id="theme-toggle">Theme</button></header><main class="login-layout"><article class="panel login-panel"><span class="login-icon">+</span><p class="eyebrow">SECURE ACCESS</p><h1>Welcome to CityCare</h1><p>Sign in to open the secured CityCare administrator workspace.</p>{% if message %}<p class="notice error">{{ message }}</p>{% endif %}<form method="post" class="login-form" id="login-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next_url or '' }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<div class="password-row"><input name="password" id="password" type="password" autocomplete="current-password" required><button type="button" class="table-button" id="toggle-password">Show</button></div></label><button class="button primary" type="submit">Sign in</button></form><p class="muted"><a class="text-link" href="{{ url_for('landing') }}">Back to home</a></p></article></main><div class="toast" id="toast"></div></body></html>
